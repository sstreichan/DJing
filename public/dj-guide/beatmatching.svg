<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Beatmatching Raster mit 4 Takten">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c77dff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f72585;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf9ff"/>
  
  <!-- Title -->
  <g font-family="Inter, Arial, sans-serif" fill="#2d1b4e">
    <text x="40" y="40" font-size="22" font-weight="700">Beatmatching: 4 Takte, 16 Beats</text>
  </g>
  
  <!-- Track Lines with Gradient -->
  <g stroke="url(#purpleGradient)" stroke-width="3">
    <line x1="60" y1="90" x2="900" y2="90"/>
    <line x1="60" y1="160" x2="900" y2="160"/>
  </g>
  
  <!-- Beat Grid Lines -->
  <g stroke="#d0c2e8" stroke-width="1.5">
    <!-- 16 beat grid -->
    <line x1="60" y1="70" x2="60" y2="180"/>
    <line x1="112" y1="70" x2="112" y2="180"/>
    <line x1="164" y1="70" x2="164" y2="180"/>
    <line x1="216" y1="70" x2="216" y2="180"/>
    <line x1="268" y1="70" x2="268" y2="180"/>
    <line x1="320" y1="70" x2="320" y2="180"/>
    <line x1="372" y1="70" x2="372" y2="180"/>
    <line x1="424" y1="70" x2="424" y2="180"/>
    <line x1="476" y1="70" x2="476" y2="180"/>
    <line x1="528" y1="70" x2="528" y2="180"/>
    <line x1="580" y1="70" x2="580" y2="180"/>
    <line x1="632" y1="70" x2="632" y2="180"/>
    <line x1="684" y1="70" x2="684" y2="180"/>
    <line x1="736" y1="70" x2="736" y2="180"/>
    <line x1="788" y1="70" x2="788" y2="180"/>
    <line x1="840" y1="70" x2="840" y2="180"/>
    <line x1="900" y1="70" x2="900" y2="180"/>
  </g>
  
  <!-- Measure Labels -->
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#6b5b7b" text-anchor="middle">
    <text x="138" y="210">Takt 1</text>
    <text x="346" y="210">Takt 2</text>
    <text x="554" y="210">Takt 3</text>
    <text x="762" y="210">Takt 4</text>
  </g>
  
  <!-- Instructions with Accent Color -->
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#9d4edd">
    <text x="60" y="260">Ziel: Kick von Track A und Track B liegt auf denselben Raster-Linien.</text>
    <text x="60" y="285">Korrigiere mit Pitch-Fader (Tempo) und Jogwheel (Phase).</text>
  </g>
  
  <!-- Accent markers for emphasis -->
  <g fill="url(#accentGradient)">
    <circle cx="60" cy="90" r="4"/>
    <circle cx="60" cy="160" r="4"/>
    <circle cx="268" cy="90" r="4"/>
    <circle cx="268" cy="160" r="4"/>
    <circle cx="476" cy="90" r="4"/>
    <circle cx="476" cy="160" r="4"/>
    <circle cx="684" cy="90" r="4"/>
    <circle cx="684" cy="160" r="4"/>
  </g>
</svg>

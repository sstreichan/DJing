<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Songaufbau: Intro, Break, Drop, Outro">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="introGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="breakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f72585;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#c77dff;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf9ff"/>
  
  <!-- Title -->
  <g font-family="Inter, Arial, sans-serif" fill="#2d1b4e">
    <text x="40" y="40" font-size="22" font-weight="700">Songaufbau (Beispiel)</text>
  </g>
  
  <!-- Song Structure Boxes -->
  <g>
    <!-- Intro -->
    <rect x="60" y="90" width="200" height="90" rx="10" fill="url(#introGradient)" stroke="#9d4edd" stroke-width="2"/>
    <!-- Break -->
    <rect x="270" y="90" width="180" height="90" rx="10" fill="url(#breakGradient)" stroke="#ff6b35" stroke-width="2"/>
    <!-- Drop -->
    <rect x="460" y="90" width="220" height="90" rx="10" fill="url(#dropGradient)" stroke="#7b2cbf" stroke-width="3"/>
    <!-- Outro -->
    <rect x="690" y="90" width="210" height="90" rx="10" fill="url(#outroGradient)" stroke="#c77dff" stroke-width="2"/>
  </g>
  
  <!-- Section Labels -->
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#faf9ff" text-anchor="middle">
    <text x="160" y="140" font-weight="700">Intro</text>
    <text x="360" y="140" font-weight="700">Break</text>
    <text x="570" y="140" font-weight="700">Drop</text>
    <text x="795" y="140" font-weight="700">Outro</text>
  </g>
  
  <!-- Descriptions -->
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#6b5b7b">
    <text x="60" y="220">Intro: wenig Elemente → gut zum Einmixen</text>
    <text x="60" y="245">Break: Spannung, oft weniger Kick</text>
    <text x="60" y="270">Drop: volle Energie, Kick + Bass dominant</text>
    <text x="60" y="295">Outro: Elemente fallen weg → gut zum Ausmixen</text>
  </g>
  
  <!-- Energy indicator icons -->
  <g fill="#9d4edd">
    <circle cx="250" cy="135" r="3"/>
    <circle cx="440" cy="135" r="3"/>
    <circle cx="670" cy="135" r="3"/>
    <circle cx="890" cy="135" r="3"/>
  </g>
</svg>

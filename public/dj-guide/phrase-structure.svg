<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Songaufbau: Intro, Break, Drop, Outro">
  <rect width="100%" height="100%" fill="#0f1115"/>
  <g font-family="Inter, Arial, sans-serif" fill="#e8edf2">
    <text x="40" y="40" font-size="22" font-weight="700">Songaufbau (Beispiel)</text>
  </g>
  <g fill="#1f2937" stroke="#4aa3ff" stroke-width="2">
    <rect x="60" y="90" width="200" height="90" rx="10"/>
    <rect x="270" y="90" width="180" height="90" rx="10"/>
    <rect x="460" y="90" width="220" height="90" rx="10"/>
    <rect x="690" y="90" width="210" height="90" rx="10"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#e8edf2" text-anchor="middle">
    <text x="160" y="140" font-weight="700">Intro</text>
    <text x="360" y="140" font-weight="700">Break</text>
    <text x="570" y="140" font-weight="700">Drop</text>
    <text x="795" y="140" font-weight="700">Outro</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7c2cc">
    <text x="60" y="220">Intro: wenig Elemente → gut zum Einmixen</text>
    <text x="60" y="245">Break: Spannung, oft weniger Kick</text>
    <text x="60" y="270">Drop: volle Energie, Kick + Bass dominant</text>
    <text x="60" y="295">Outro: Elemente fallen weg → gut zum Ausmixen</text>
  </g>
</svg>

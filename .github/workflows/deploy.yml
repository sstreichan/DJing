name: Deploy to GitHub Pages & Release

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up .npmrc for private packages
        run: |
          cat > ~/.npmrc <<EOF
          //nexus.senseaition.com/repository/npm-private/:_authToken=${{ secrets.NPM_TOKEN }}
          //nexus.senseaition.com/repository/npm/:_authToken=${{ secrets.NPM_TOKEN }}
          EOF

      - name: Install dependencies (npm)
        run: |
          npm ci

      - name: Run semantic-release (version, changelog, release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Build site (npm)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish Pages
        uses: actions/deploy-pages@v4

name: PR build check

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up .npmrc for private packages
        run: echo "//nexus.senseaition.com/repository/npm-private/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc && \
            echo "//nexus.senseaition.com/repository/npm/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
      - name: Install dependencies (npm)
        run: npm ci
      - name: Lint (npm)
        run: npm run lint
      - name: Test (npm)
        run: npm run test
      - name: Build site (npm)
        run: npm run build

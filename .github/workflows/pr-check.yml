name: PR build check

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (npm)
        run: npm ci
      - name: Lint (npm)
        run: npm run lint
      - name: Test (npm)
        run: npm run test
      - name: Build site (npm)
        run: npm run build

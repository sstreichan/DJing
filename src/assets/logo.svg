<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="vinylGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7b2cbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a1f94;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Vinyl Record -->
  <g id="vinyl">
    <!-- Outer circle -->
    <circle cx="24" cy="24" r="20" fill="url(#vinylGradient)" opacity="0.9"/>
    
    <!-- Grooves -->
    <circle cx="24" cy="24" r="18" fill="none" stroke="#2d1b4e" stroke-width="0.5" opacity="0.3"/>
    <circle cx="24" cy="24" r="16" fill="none" stroke="#2d1b4e" stroke-width="0.5" opacity="0.3"/>
    <circle cx="24" cy="24" r="14" fill="none" stroke="#2d1b4e" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Label (center) -->
    <circle cx="24" cy="24" r="8" fill="#2d1b4e" opacity="0.7"/>
    
    <!-- Center hole -->
    <circle cx="24" cy="24" r="2.5" fill="#faf9ff"/>
  </g>
  
  <!-- Tone Arm -->
  <g id="tonearm">
    <!-- Arm base -->
    <circle cx="42" cy="6" r="2.5" fill="url(#purpleGradient)"/>
    
    <!-- Arm -->
    <path d="M 42 6 L 36 18 L 32 22" 
          stroke="url(#purpleGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          fill="none"/>
    
    <!-- Needle/Cartridge -->
    <circle cx="32" cy="22" r="1.8" fill="#ff6b35"/>
  </g>
  
  <!-- Text: DJ-Anleitung -->
  <g id="text">
    <text x="54" y="32" 
          font-family="'Inter', sans-serif" 
          font-size="22" 
          font-weight="700" 
          fill="url(#purpleGradient)">
      DJ-Anleitung
    </text>
  </g>
</svg>
